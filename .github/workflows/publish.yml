#
# Publish: on `v*` tag push, build sdist + wheel and upload to PyPI
# via PyPI Trusted Publishing (OIDC, no long-lived API tokens).
# Distribution name is `ml-datarefinery`; the import name and console
# script stay `datarefinery`.
#
# Preconditions (configured once, outside this workflow):
#   - PyPI "pending publisher" bound to repo `pointmatic/datarefinery`,
#     workflow `publish.yml`, environment `pypi`.
#   - GitHub Actions environment `pypi` with required-reviewer
#     protection (a maintainer must approve each production deploy).
#
# This workflow runs in parallel with `release.yml`; the GitHub Release
# is created from the same tag and CHANGELOG section by that workflow.

name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject.toml version matches tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pyproject_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${pyproject_version}" != "${version}" ]; then
            echo "::error::Tag ${tag} does not match pyproject.toml version ${pyproject_version}"
            exit 1
          fi

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ml-datarefinery
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
