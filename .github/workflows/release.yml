#
# Release: on `v*` tag push, extract the matching CHANGELOG.md section
# and create a GitHub Release with that body. Runs alongside
# `.github/workflows/publish.yml`, which publishes the sdist + wheel
# to TestPyPI and PyPI from the same tag (PyPI distribution name
# `ml-datarefinery`; see docs/guides/releasing.md).
#
# Tag protection (only maintainers can push `v*` tags) is a developer-
# configured repo setting (GitHub UI -> Settings -> Tags -> Tag
# protection rules); it is not expressible in this workflow.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml version matches tag
        run: |
          pyproject_version="$(python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${pyproject_version}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match pyproject.toml version ${pyproject_version}"
            exit 1
          fi

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="$(awk -v ver="${version}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf "%s" "${notes}" | tr -d "[:space:]")" ]; then
            echo "::error::No CHANGELOG.md section found for [${version}]"
            exit 1
          fi
          {
            echo "notes<<__EOF__"
            printf "%s\n" "${notes}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            --verify-tag
