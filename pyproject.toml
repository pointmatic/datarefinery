[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-datarefinery"
version = "0.17.1"
description = "Recipe-driven data preparation and caching for machine learning"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "Pointmatic" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "pyyaml",
    "pydantic>=2",
    "rich",
    "typer",
    "click>=8",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
llm = ["lmentry"]
corruptions = ["scikit-image", "opencv-python-headless"]

[project.urls]
Homepage = "https://github.com/pointmatic/datarefinery"

[project.scripts]
datarefinery = "datarefinery.cli.app:main_entry"

# Plugin discovery group; populated by Phase C stories
# (image_classification: C.b; tabular and text: C.c).
[project.entry-points."datarefinery.plugins"]
image_classification = "datarefinery.plugins.image_classification.plugin:PLUGIN"
tabular = "datarefinery.plugins.tabular.plugin:PLUGIN"
text = "datarefinery.plugins.text.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/datarefinery"]

[tool.hatch.build.targets.sdist]
include = ["src/datarefinery", "LICENSE", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# click ships without `py.typed`; its public API is consumed by
# `cli/app.py` for exit-handling and exception classes. The stubs
# package (`types-click`) is no longer maintained as click ships its
# own typing as of v8.2 — but mypy still flags missing stubs when CI
# uses an older click. Suppress at the module level.
[[tool.mypy.overrides]]
module = ["click", "click.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests that exercise the full pipeline at multiple worker counts; CI may opt to run these on demand only (e.g. `pytest -m 'not slow'`).",
]

# ---------------------------------------------------------------------------
# Coverage configuration (Story E.g, FR-4 reproducibility-contract gates).
#
# `pytest-cov` does not natively support per-module `fail_under`, so the
# strategy is:
#
#   1. `[tool.coverage.run].source` scopes a default `pyve test --cov`
#      run to the package. Local invocation: `pyve test --cov`.
#   2. The "core invariant" set listed below is the floor that gates
#      the cache/reproducibility contract. CI (Phase G, Story G.a)
#      runs coverage against just these modules with
#      `--cov-fail-under=95`. The list lives in this file so the
#      gate is visible without tracing CI YAML.
#   3. The project-wide percentage gate is intentionally NOT set
#      pre-production (per features.md "Acceptance Criteria"). It is
#      enabled at the v1.0.0 production-release event (Story F.d).
#
# pre-prod: project-wide gate enabled at production release
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/datarefinery"]
branch = false

[tool.coverage.report]
# fail_under is intentionally unset pre-production; CI imposes the
# core-invariant gate on a per-module basis instead. See above.
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Per-module coverage thresholds for the core-invariant set. CI workflow
# (Phase G) consumes this list to invoke `coverage report
# --include=<module>` with `--fail-under=95` per module. The thresholds
# enforce the FR-4 reproducibility contract and the
# `project-essentials.md` "Cache identity" + "Determinism contract"
# rules.
[tool.coverage.datarefinery]
core_invariant_modules = [
    "src/datarefinery/recipe/loader.py",
    "src/datarefinery/recipe/canonical.py",
    "src/datarefinery/cache/identity.py",
    "src/datarefinery/cache/atomic.py",
    "src/datarefinery/pipeline/stages/splits.py",
    "src/datarefinery/pipeline/workers.py",
    "src/datarefinery/plugins/base.py",
    "src/datarefinery/plugins/discovery.py",
]
core_invariant_threshold = 95
