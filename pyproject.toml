[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datarefinery"
version = "0.4.3"
description = "Recipe-driven data preparation and caching for machine learning"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "Pointmatic" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "pyyaml",
    "pydantic>=2",
    "rich",
    "typer",
    "pillow",
]

[project.optional-dependencies]
llm = ["lmentry"]

[project.urls]
Homepage = "https://github.com/pointmatic/datarefinery"

[project.scripts]
datarefinery = "datarefinery.cli.app:main_entry"

# Plugin discovery group; populated by Phase C stories
# (image_classification: C.b; tabular and text: C.c).
[project.entry-points."datarefinery.plugins"]
image_classification = "datarefinery.plugins.image_classification.plugin:PLUGIN"
tabular = "datarefinery.plugins.tabular.plugin:PLUGIN"
text = "datarefinery.plugins.text.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["src/datarefinery"]

[tool.hatch.build.targets.sdist]
include = ["src/datarefinery", "LICENSE", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
